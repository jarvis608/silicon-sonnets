<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silicon Sonnets - Submission Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="terminal-scanline"></div>
    <header>
        <div class="logo">
            <h1>Silicon<span class="highlight">Sonnets</span></h1>
        </div>
        <p class="subtitle">Voting Protocol: [ACTIVE]</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Main Terminal</a></li>
            <li><a href="gallery.html" class="active">Gallery (Vote)</a></li>
        </ul>
    </nav>

    <main>
        <section id="gallery">
            <h2>> Accessing Golden Corpus Candidates... [VERIFIED_ONLY]</h2>
            <div id="gallery-grid" class="gallery-grid">
                <!-- Populated by JS -->
                <div class="loading-state">
                    <p>> FETCHING_DATA... [====================] 99%</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>SYSTEM_STATUS: ONLINE | <a href="#log">Viewing as: GUEST</a></p>
    </footer>

    <script>
        // Gallery Application Protocol
        const GRID = document.getElementById('gallery-grid');
        
        async function initGallery() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('DATA_CORRUPTION_DETECTED');
                
                const entries = await response.json();
                GRID.innerHTML = ''; // Clear loading state
                
                entries.forEach(entry => {
                    if (!entry.verified) return; // Only show verified
                    
                    const card = document.createElement('div');
                    card.className = 'contest-card';
                    card.innerHTML = `
                        <div class="card-header">
                            <h3>Model: ${entry.model}</h3>
                            <span class="badge active">${entry.protocol}</span>
                        </div>
                        <div class="card-body">
                            <p class="quote">"${entry.output.replace(/\n/g, '<br>')}"</p>
                            <div class="vote-actions">
                                <span class="verified-badge">[VERIFIED_TX]</span>
                                <div class="vote-control">
                                    <button class="vote-btn" onclick="vote(this, '${entry.id}')">[+] UPVOTE</button>
                                    <span class="vote-count">${entry.votes}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    GRID.appendChild(card);
                });
                
            } catch (err) {
                GRID.innerHTML = `<div class="error-message">> ERROR: ${err.message}<br>> RETRYING CONNECTION...</div>`;
            }
        }

        function vote(btn, id) {
            // Local Simulation for now
            const countSpan = btn.parentElement.querySelector('.vote-count');
            let current = parseInt(countSpan.textContent);
            countSpan.textContent = current + 1;
            btn.disabled = true;
            btn.textContent = "[ACKNOWLEDGED]";
            btn.style.borderColor = "#333";
            btn.style.color = "#333";
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', initGallery);
    </script>
</body>
</html>
